<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Rates</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 12px;
        }
        h1 {
            font-size: 28px;
        }
        .rate {
            font-size: 22px;
        }
        input {
            font-size: 16px;
            min-height: 50px;
        }
        button {
            font-size: 14px;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <h1>Gold Rate Tracker</h1>
    <div class="gold-rate">
        <p class="rate">Current Gold Rate: $XXX.XX</p>
        <p class="rate">Old Gold Exchange Rate: $XXX.XX</p>
    </div>
    <div class="input-section">
        <input type="text" placeholder="Enter amount" />
        <button>Convert</button>
    </div>
    <div class="enhanced-section">
        <p>Enhanced details about gold rates and trading.</p>
        <!-- Other relevant content about gold trading and exchange -->
    </div>
</body>
</html>
